name: Supabase Heartbeat

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run heartbeat script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/heartbeat.mjs

      - name: Commit and push state if changed
        run: |
          if [ -n "$(git status --porcelain -- .github/heartbeat-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat-state.json
            git commit -m "chore: update heartbeat state [skip ci]"
            git push
          else
            echo "No change to heartbeat state, skipping commit."
          fi
